name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends rsync procps python3 python3-pip
          pip3 install --break-system-packages pypdf pygments
      - name: Run the test gauntlet
        run: sh tests/run_tests.sh
